<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raj Jaiswal | Interactive OS Portfolio</title>
    <style>
        :root {
            --bg-dark: #090d16;
            --window-bg: rgba(15, 23, 42, 0.65);
            --window-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.4);
            --window-shadow: rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
        }

        /* --- Animated Glowing Wave Background --- */
        .bg-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #1e1b4b 0%, #090d16 100%);
        }

        .glow-orb {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.12) 0%, rgba(0,0,0,0) 70%);
            top: -200px;
            left: -200px;
            animation: floatOrb 25s infinite alternate linear;
            border-radius: 50%;
        }

        .glow-orb-2 {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.1) 0%, rgba(0,0,0,0) 70%);
            bottom: -150px;
            right: -150px;
            animation: floatOrb 18s infinite alternate-reverse linear;
            border-radius: 50%;
        }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(100px, 80px) scale(1.2); }
        }

        /* --- Desktop Environment --- */
        .desktop {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 2;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            align-content: flex-start;
            flex-wrap: wrap;
        }

        /* --- Desktop Shortcuts & Click Mechanics --- */
        .icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 95px;
            height: 95px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
            border: 1px solid transparent;
        }

        .icon:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .icon:active {
            transform: scale(0.92) translateY(0);
        }

        .icon-symbol {
            font-size: 2.5rem;
            margin-bottom: 8px;
            filter: drop-shadow(0 4px 10px var(--accent-glow));
            transition: transform 0.3s ease;
        }

        .icon:hover .icon-symbol {
            transform: scale(1.1);
        }

        .icon-label {
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }

        /* --- Multi Window Blueprint --- */
        .window {
            position: absolute;
            width: 420px;
            min-height: 250px;
            background: var(--window-bg);
            border: 1px solid var(--window-border);
            border-radius: 16px;
            box-shadow: 0 30px 60px var(--window-shadow);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            z-index: 10;
            
            /* Animation States */
            display: none;
            flex-direction: column;
            overflow: hidden;
            opacity: 0;
            transform: scale(0.85) translateY(30px);
            transition: opacity 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), 
                        transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Windows Open State Animation */
        .window.win-open {
            display: flex;
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        /* Windows Closing State Animation */
        .window.win-closing {
            opacity: 0;
            transform: scale(0.85) translateY(30px);
        }

        /* --- Window Titlebar --- */
        .titlebar {
            background: rgba(9, 13, 22, 0.5);
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: move;
            border-bottom: 1px solid var(--window-border);
        }

        .window-title {
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .window-controls {
            display: flex;
            gap: 8px;
        }

        .control-btn {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            cursor: pointer;
            border: none;
            transition: transform 0.2s, background-color 0.2s;
        }

        .control-btn:hover {
            transform: scale(1.15);
        }

        .btn-close { background-color: #ef4444; }
        .btn-close:hover { background-color: #f87171; }
        .btn-min { background-color: #f59e0b; }
        .btn-min:hover { background-color: #fbbf24; }

        /* --- Window Content & Typography --- */
        .window-content {
            padding: 24px;
            flex-grow: 1;
            overflow-y: auto;
            color: var(--text-main);
            font-size: 0.95rem;
            line-height: 1.6;
            user-select: text;
        }

        .profile-header h1 {
            color: var(--accent);
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
        }
        .profile-header p {
            color: var(--text-muted);
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* --- Skills Architecture Animation --- */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 10px;
        }

        .skill-card {
            background: rgba(255,255,255,0.03);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.05);
            border-left: 4px solid var(--accent);
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .skill-card:hover {
            background: rgba(56, 189, 248, 0.08);
            transform: translateX(4px);
            border-color: rgba(56, 189, 248, 0.2);
        }

        /* --- Contact Framework --- */
        .contact-list {
            list-style: none;
        }

        .contact-list li {
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .contact-list a {
            color: var(--accent);
            text-decoration: none;
            transition: color 0.2s, opacity 0.2s;
        }
        .contact-list a:hover {
            color: #7dd3fc;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Animated Glowing Core -->
    <div class="bg-wrapper">
        <div class="glow-orb"></div>
        <div class="glow-orb-2"></div>
    </div>

    <!-- Desktop Grid Workspace -->
    <div class="desktop">
        
        <!-- Multi-Window Triggering Shortcut Buttons -->
        <div class="icon" onclick="openWindow('win-about')">
            <span class="icon-symbol">👤</span>
            <span class="icon-label">About Me</span>
        </div>

        <div class="icon" onclick="openWindow('win-skills')">
            <span class="icon-symbol">🛠️</span>
            <span class="icon-label">Tech Stack</span>
        </div>

        <div class="icon" onclick="openWindow('win-contact')">
            <span class="icon-symbol">📞</span>
            <span class="icon-label">Contact</span>
        </div>

    </div>

    <!-- WINDOW 1: Profile Profile -->
    <div id="win-about" class="window" style="top: 15%; left: 25%;">
        <div class="titlebar">
            <div class="window-title">👤 About Raj</div>
            <div class="window-controls">
                <button class="control-btn btn-min" onclick="closeWindow('win-about')"></button>
                <button class="control-btn btn-close" onclick="closeWindow('win-about')"></button>
            </div>
        </div>
        <div class="window-content">
            <div class="profile-header">
                <h1>RAJ JAISWAL</h1>
                <p>Full Stack Developer</p>
            </div>
            <p>I build enterprise-grade frontend systems and resilient backend pipelines. Welcome to my custom window environment built completely natively with pure system mechanics.</p>
        </div>
    </div>
